[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tma4215-project1"
version = "0.1.0"
description = "TMA4215 Project Part 1: approximation and interpolation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "autograd>=1.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tma4215_project1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
